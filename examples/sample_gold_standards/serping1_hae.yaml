question: |
  A 27-year-old woman with recurrent painful subcutaneous and laryngeal
  swelling has low C1-INH antigen and function, and a heterozygous SERPING1
  truncating variant. What is the rationale for plasma kallikrein-directed
  prophylaxis and which therapies are currently available?

