[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-rag-eval"
version = "0.1.0"
description = "Evaluation harness for biomedical RAG and agentic systems"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "bio-rag-eval contributors" }]
keywords = ["biomedical", "RAG", "evaluation", "LLM", "clinical", "rare-disease"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "fda-strategy-triples>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.1.0",
]

[project.scripts]
bio-rag-eval = "bio_rag_eval.cli:main"

[project.urls]
Repository = "https://github.com/your-org/bio-rag-eval"
Issues = "https://github.com/your-org/bio-rag-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_rag_eval"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=bio_rag_eval --cov-report=term-missing -q"

[tool.coverage.run]
source = ["src"]
